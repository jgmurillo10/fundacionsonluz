name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Local D1/R2 and Next.js HTTP integration
        run: |
          export SONLUZ_ADMIN_EMAIL=editor@example.test
          export SONLUZ_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SONLUZ_ADMIN_PASSWORD"
          export SONLUZ_ADDITIONAL_ADMIN_EMAIL=second-editor@example.test
          export SONLUZ_ADDITIONAL_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SONLUZ_ADDITIONAL_ADMIN_PASSWORD"
          npm run cms:setup
          npm run cms:migrate:local
          npm run cms:dev -- --port 8787 > .wrangler/worker.log 2>&1 &
          WORKER_PID=$!
          npm run start -- --port 3005 > .wrangler/site.log 2>&1 &
          SITE_PID=$!
          trap 'kill "$WORKER_PID" "$SITE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -s -o /dev/null http://127.0.0.1:8787/posts && curl -s -o /dev/null http://127.0.0.1:3005/admin/login; then
              break
            fi
            sleep 1
          done
          npm run cms:smoke
